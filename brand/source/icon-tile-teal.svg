<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style type="text/css">
      @import url("https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500&amp;display=swap");
      .b { font-family: 'Satoshi', system-ui, sans-serif; font-weight: 500; fill: #0B1220; }
      .w { font-family: 'Satoshi', system-ui, sans-serif; font-weight: 900; fill: #0B1220; }
    </style>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" ry="56" fill="url(#tile)"/>
  <text x="128" y="180" text-anchor="middle" font-size="160">
    <tspan class="b">[</tspan><tspan class="w">W</tspan><tspan class="b">]</tspan>
  </text>
</svg>
