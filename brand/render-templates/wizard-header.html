<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_common.css">
<style>
body { background: #FFFFFF; display: flex; align-items: center; padding: 0 18px; gap: 14px; }
.tile-mini { width: 42px; height: 42px; border-radius: 18%; background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tile-mini .icon-w { font-size: 22px; }
.tile-mini .icon-w .b { color: #2DD4BF; }
.tile-mini .icon-w .w { color: #E2E8F0; }
.text-block { display: flex; flex-direction: column; gap: 2px; }
.h-title { font-family: 'Satoshi', sans-serif; font-weight: 700; font-size: 14px; color: #0F172A; }
.h-sub { font-family: 'Satoshi', sans-serif; font-weight: 400; font-size: 11px; color: #475569; }
</style></head>
<body>
  <div class="tile-mini"><span class="icon-w"><span class="b">[</span><span class="w">W</span><span class="b">]</span></span></div>
  <div class="text-block">
    <span class="h-title">WinClip Setup</span>
    <span class="h-sub">Smart clipboard actions for Windows</span>
  </div>
</body></html>
