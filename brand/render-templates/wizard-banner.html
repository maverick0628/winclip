<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_common.css">
<style>
body { background: linear-gradient(160deg, #0B1220 0%, #1E293B 100%); display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 24px 20px; position: relative; overflow: hidden; }
body::before { content: ''; position: absolute; top: -40px; right: -40px; width: 120px; height: 120px; background: radial-gradient(circle, rgba(45,212,191,0.20) 0%, transparent 70%); }
.top { position: relative; z-index: 1; }
.wm { font-size: 22px; color: #E2E8F0; }
.wm .b { color: #2DD4BF; }
.tag { font-family: 'Satoshi', sans-serif; font-weight: 500; font-size: 11px; color: #94A3B8; margin-top: 10px; line-height: 1.4; max-width: 110px; }
.bottom { font-family: 'Satoshi', sans-serif; font-weight: 700; font-size: 10px; color: #64748B; letter-spacing: 0.15em; text-transform: uppercase; position: relative; z-index: 1; }
</style></head>
<body>
  <div class="top">
    <span class="wm"><span class="b">[</span><span class="body">WinClip</span><span class="b">]</span></span>
    <div class="tag">Smart clipboard actions for Windows.</div>
  </div>
  <div class="bottom">Setup</div>
</body></html>
